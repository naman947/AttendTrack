<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Attendify — Attendance Dashboard</title>

<style>
*{box-sizing:border-box}

:root{
  --navy:#0f2347;
  --navy2:#173663;
  --blue:#2563eb;
  --blue2:#4f7cff;
  --cyan:#20b9ee;
  --bg:#f4f7fb;
  --paper:#fff;
  --text:#14213d;
  --muted:#718096;
  --line:#e5eaf2;
  --green:#169b62;
  --red:#d94b57;
  --orange:#e79516;
  --gold:#c9952e;
  --shadow:0 18px 50px rgba(15,35,71,.10);
  --softshadow:0 8px 24px rgba(15,35,71,.07)
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:
    radial-gradient(circle at 50% -10%,#fff 0,#f7f9fc 38%,var(--bg) 100%);
  font-family:
    Inter,ui-sans-serif,system-ui,-apple-system,
    BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:var(--text)
}

body:before{
  content:"";
  display:block;
  height:5px;
  background:
    linear-gradient(
      90deg,
      var(--navy),
      var(--blue),
      var(--cyan),
      var(--blue),
      var(--navy)
    )
}

.page{
  max-width:860px;
  margin:auto;
  padding:30px 18px 48px
}

/* HEADER */

.brand{
  text-align:center;
  margin:0 0 24px
}

.brand-logo{
  width:118px;
  height:92px;
  object-fit:contain;
  display:block;
  margin:0 auto 3px;
  filter:drop-shadow(0 12px 18px rgba(37,99,235,.16))
}

.brand small{
  font-size:10px;
  font-weight:900;
  color:var(--gold);
  letter-spacing:2.8px
}

.brand h1{
  font-family:Georgia,"Times New Roman",serif;
  font-size:44px;
  line-height:1.02;
  margin:7px 0 10px;
  letter-spacing:-1.5px;
  color:var(--navy)
}

.brand p{
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
  margin:0 auto 12px;
  max-width:590px
}

.now{
  display:inline-flex;
  align-items:center;
  gap:7px;
  font-size:10px;
  color:#65748b;
  background:#fff;
  border:1px solid var(--line);
  padding:6px 10px;
  border-radius:999px;
  box-shadow:0 4px 14px rgba(15,35,71,.05)
}

.dot{
  color:var(--green);
  font-size:9px;
  margin:0
}

/* MAIN PANEL */

.panel{
  background:rgba(255,255,255,.94);
  border:1px solid #e1e7f0;
  border-radius:24px;
  padding:22px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(10px)
}

.panel>h2{
  font-family:Georgia,"Times New Roman",serif;
  font-size:22px;
  margin:0;
  color:var(--navy);
  letter-spacing:-.3px
}

h2{
  font-size:15px;
  margin:0 0 3px
}

.sub{
  font-size:10px;
  color:var(--muted);
  margin:4px 0 15px
}

/* FORM */

.form{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px
}

label{
  font-size:10px;
  font-weight:800;
  display:block;
  margin-bottom:6px;
  color:#53627a;
  letter-spacing:.15px
}

input,
select{
  width:100%;
  height:43px;
  border:1px solid #d9e1ec;
  border-radius:11px;
  padding:0 12px;
  background:#fbfcfe;
  color:#263550;
  font-size:13px;
  outline:none;
  transition:.2s
}

input:hover,
select:hover{
  border-color:#bdcbe0;
  background:#fff
}

input:focus,
select:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 4px rgba(37,99,235,.09);
  background:#fff
}

/* BUTTONS */

.actions{
  display:flex;
  gap:9px;
  margin-top:14px
}

.btn{
  border:0;
  border-radius:10px;
  padding:11px 16px;
  font-size:11px;
  font-weight:900;
  cursor:pointer;
  transition:.2s
}

.btn:hover{
  transform:translateY(-1px)
}

.primary{
  background:linear-gradient(135deg,var(--navy),#2454a6);
  color:#fff;
  box-shadow:0 8px 18px rgba(15,35,71,.18)
}

.light{
  background:#f0f3f8;
  color:#526178;
  border:1px solid #e1e6ee
}

/* QUICK TARGET */

.quick{
  margin-top:15px;
  font-size:10px;
  font-weight:900;
  color:#53627a
}

.chips{
  display:flex;
  gap:7px;
  margin-top:8px;
  flex-wrap:wrap
}

.chip{
  border:1px solid #dfe6f0;
  background:#f7f9fc;
  color:#49658f;
  padding:7px 12px;
  border-radius:999px;
  font-size:10px;
  font-weight:900;
  cursor:pointer;
  transition:.2s
}

.chip:hover{
  border-color:#b9c9e6;
  background:#eef4ff
}

.chip.active{
  border-color:#8eacf0;
  background:#eaf1ff;
  color:#1e58c8;
  box-shadow:inset 0 0 0 1px #d0ddfa
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:18px
}

.stat{
  position:relative;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px 12px;
  background:linear-gradient(145deg,#fff,#f8faff);
  box-shadow:var(--softshadow)
}

.stat:before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:3px;
  background:linear-gradient(var(--blue),var(--cyan));
  border-radius:10px
}

.stat b{
  font-size:21px;
  color:var(--navy);
  letter-spacing:-.5px
}

.stat span{
  display:block;
  color:var(--muted);
  font-size:9px;
  margin-top:4px;
  line-height:1.35;
  font-weight:700
}

/* ATTENDANCE RING */

.center{
  text-align:center;
  margin:22px 0 13px
}

.ring{
  width:164px;
  height:164px;
  border-radius:50%;
  margin:auto;
  display:grid;
  place-items:center;
  position:relative;
  background:
    conic-gradient(
      var(--blue) 0 304deg,
      #e8edf4 304deg 360deg
    );
  box-shadow:0 12px 35px rgba(37,99,235,.16)
}

.ring:before{
  content:"";
  position:absolute;
  inset:8px;
  border-radius:50%;
  background:rgba(255,255,255,.42)
}

.ring:after{
  content:"";
  width:126px;
  height:126px;
  border-radius:50%;
  background:#fff;
  position:absolute;
  box-shadow:inset 0 0 0 1px #edf1f6
}

.ringText{
  position:relative;
  z-index:1;
  text-align:center
}

.ringText b{
  font-family:Georgia,"Times New Roman",serif;
  font-size:29px;
  display:block;
  color:var(--navy);
  letter-spacing:-.8px
}

.ringText small{
  font-size:8px;
  font-weight:900;
  color:#7a879a;
  letter-spacing:1.3px
}

/* PROGRESS */

.progress-head{
  display:flex;
  justify-content:space-between;
  font-size:9px;
  font-weight:900;
  color:#5e6d83
}

.progress{
  height:9px;
  background:#e8edf4;
  border-radius:20px;
  overflow:hidden;
  margin-top:7px
}

.progress i{
  display:block;
  height:100%;
  background:
    linear-gradient(
      90deg,
      var(--navy),
      var(--blue),
      var(--cyan)
    );
  border-radius:20px;
  transition:width .35s ease
}

/* SECTIONS */

.section{
  border-top:1px solid #edf0f4;
  margin-top:22px;
  padding-top:18px
}

.section h3{
  font-family:Georgia,"Times New Roman",serif;
  font-size:16px;
  margin:0 0 4px;
  color:var(--navy)
}

.section p{
  font-size:9px;
  color:var(--muted);
  margin:0 0 11px
}

/* TARGET CARDS */

.target-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px
}

.target-card{
  text-align:center;
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px 5px;
  background:#fbfcfe;
  transition:.2s
}

.target-card:hover{
  transform:translateY(-2px);
  box-shadow:var(--softshadow);
  background:#fff
}

.target-card b{
  font-size:10px;
  color:var(--navy)
}

.target-card span{
  display:block;
  font-size:8px;
  color:var(--muted);
  margin-top:4px
}

.target-card em{
  display:block;
  font-size:8px;
  color:var(--blue);
  font-style:normal;
  margin-top:3px;
  font-weight:800
}

/* SCENARIOS */

.scenarios{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px
}

.scenario{
  border:1px solid var(--line);
  border-radius:12px;
